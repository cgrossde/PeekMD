name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Version that produced bun.lock; keep in step with local bun.
          bun-version: "1.4.4"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "=2.11.4" --locked
      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Extract version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Cargo/Tauri version
        run: |
          set -e
          TAG="${{ steps.v.outputs.version }}"
          CARGO_V=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          TAURI_V=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          PKG_V=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          for V in "$CARGO_V" "$TAURI_V" "$PKG_V"; do
            if [ "$V" != "$TAG" ]; then
              echo "Version mismatch: tag=v$TAG but found $V" >&2; exit 1
            fi
          done

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build signed + notarized DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          # Fail the release rather than ship an unsigned or unnotarized build.
          missing=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -z "${!v:-}" ]; then echo "::error::secret $v is not set"; missing=1; fi
          done
          if [ ! -s "$APPLE_API_KEY_PATH" ]; then echo "::error::secret APPLE_API_KEY_P8 is not set"; missing=1; fi
          [ "$missing" = 0 ]
          bash scripts/release-signed.sh

      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Locate DMG and compute checksum
        id: dmg
        run: |
          set -e
          DMG=$(ls src-tauri/target/release/bundle/dmg/PeekMD_*_aarch64.dmg | head -1)
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            "${{ steps.dmg.outputs.path }}" \
            --title "v${{ steps.v.outputs.version }}" \
            --generate-notes

      - name: Update homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          set -e
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/cgrossde/homebrew-tap.git" tap
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__SHA256__/${SHA256}/g" \
              scripts/cask-template.rb.tmpl > tap/Casks/peekmd.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/peekmd.rb
          git commit -m "peekmd: v${VERSION}"
          git push origin main
