[package]
name = "peekmd"
version = "0.1.1"
description = "PeekMD — GitHub-flavored Markdown previewer"
authors = []
edition = "2021"
default-run = "peekmd"

[[bin]]
name = "peekmd-cli"
path = "src/bin/peekmd-cli.rs"

[lib]
name = "peekmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2.4"
notify = "8"
notify-debouncer-mini = "0.7"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2.2"

comrak = "0.52"
syntect = "5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
parking_lot = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"

# Debug-only control socket (screenshots, eval, DOM inspection).
# Always compiled; only initialised in debug builds via #[cfg(debug_assertions)] in lib.rs.
tauri-plugin-playwright = "0.2"

# macOS-only: request default-handler status for Markdown on first launch (default_app.rs).
# All but objc2-uniform-type-identifiers already arrive transitively via tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# objc2-uniform-type-identifiers is NOT a default feature; without it the
# UTType-taking NSWorkspace methods are compiled out.
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "objc2-uniform-type-identifiers",
] }
objc2-uniform-type-identifiers = "0.3"
block2 = "0.6"
